# Dev-only sidecar that persists custom liturgical day-name translations.
# Run from liturgical-calendar/:  docker compose up -d
# Then run the app with:          npm run dev   (Vite proxies /api -> :8090)

services:
  translations-api:
    image: node:20-alpine
    working_dir: /app
    command: node server.js
    environment:
      - PORT=8090
      - DATA_FILE=/data/custom-translations.json
    volumes:
      - ./translations-api:/app
      - ./data:/data
    ports:
      - "8090:8090"

  events-api:
    build: ./events-api
    environment:
      - PORT=8091
      - RADICALE_URL=http://radicale:5232
      - RADICALE_USER=calendar-api
      - RADICALE_PASSWORD=development-only
      - LITURGICAL_DIST=/calendar-dist
    volumes:
      - ./dist:/calendar-dist:ro
    ports:
      - "8091:8091"
    depends_on:
      radicale:
        condition: service_healthy

  radicale:
    build: ./radicale
    environment:
      - RADICALE_USER=calendar-api
      - RADICALE_PASSWORD=development-only
    volumes:
      - ./data/radicale:/var/lib/radicale/collections
