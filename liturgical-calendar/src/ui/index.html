<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário Litúrgico</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <div class="header-top">
      <h1 id="app-title">Calendário Litúrgico</h1>
      <div class="control-group">
        <select id="lang-select" aria-label="Idioma"></select>
      </div>
    </div>
    <div class="controls">
      <div class="control-group">
        <label for="version-select" id="label-version">Versão:</label>
        <select id="version-select"></select>
      </div>
      <div class="control-group">
        <label for="year-input" id="label-year">Ano:</label>
        <input type="number" id="year-input" min="2025" max="3000">
      </div>
      <div class="control-group view-toggle">
        <button id="btn-grid" class="active">Grade</button>
        <button id="btn-agenda">Agenda</button>
        <button id="btn-translations" class="hidden">Traduções</button>
      </div>
      <div class="calendar-actions">
        <button id="btn-subscribe" class="calendar-action-btn subscribe-btn" type="button">Inscrever</button>
        <button id="btn-download" class="calendar-action-btn download-btn" type="button">Baixar .ics</button>
      </div>
    </div>
  </header>
  <main>
    <div id="calendar-grid" class="view"></div>
    <div id="calendar-agenda" class="view hidden"></div>
    <div id="calendar-translations" class="view hidden"></div>
  </main>
  <footer>
    <div class="color-legend">
      <span class="legend-item">
        <span class="swatch swatch-white"></span><span data-i18n="colors.white">Branco</span>
      </span>
      <span class="legend-item">
        <span class="swatch swatch-red"></span><span data-i18n="colors.red">Vermelho</span>
      </span>
      <span class="legend-item">
        <span class="swatch swatch-green"></span><span data-i18n="colors.green">Verde</span>
      </span>
      <span class="legend-item">
        <span class="swatch swatch-violet"></span><span data-i18n="colors.violet">Violeta</span>
      </span>
      <span class="legend-item">
        <span class="swatch swatch-rose"></span><span data-i18n="colors.rose">Rosa</span>
      </span>
      <span class="legend-item">
        <span class="swatch swatch-black"></span><span data-i18n="colors.black">Preto</span>
      </span>
    </div>
    <p><span data-i18n="legend.powered">Desenvolvido com</span> <a href="https://github.com/divinumofficium/divinum-officium">Divinum Officium</a></p>
  </footer>
  <script type="module" src="./app.ts"></script>
</body>
</html>
